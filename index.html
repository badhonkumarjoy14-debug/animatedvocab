<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho&display=swap" rel="stylesheet">
<title>Kanji Study Pro + Progress Tracker</title>

<link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="container">
  <header>
    <div class="top-bar">
      <h1>Japanese Study Sensei</h1>
      <select id="setSelect"></select>
    </div>

    <span class="progress-info" id="progressText">Word 0 of 0 (0%)</span>
    <div class="progress-container">
      <div id="progressBar"></div>
    </div>

    <div class="mode-grid">
      <button class="mode-btn active" id="btn-K2M">Kanji → Read/Mean</button>
      <button class="mode-btn" id="btn-S2MK">Sound → Kanji/Mean</button>
      <button class="mode-btn" id="btn-M2SK">Meaning → Kanji/Read</button>
    </div>
  </header>

  <div class="flashcard">
    <div id="displayMain" class="main-text"></div>
    <div id="displaySub" class="sub-text hidden"></div>
    <div id="displayMeaning" class="meaning-text hidden"></div>
    <div id="displayRomaji" class="romaji-text hidden"></div>
  </div>

  <div class="controls-grid">
    <button class="btn-reveal" id="revealBtn">REVEAL ANSWER</button>
    <button class="btn-stroke" id="strokesBtn">PRACTICE STROKE ORDER</button>
    <button class="btn-nav" id="previousBtn">PREVIOUS</button>
    <button class="btn-nav" id="nextBtn">NEXT</button>
  </div>

  <div id="strokeSection" class="stroke-section"></div>
</div>

<script src="app.js"></script>


</body>
</html>
